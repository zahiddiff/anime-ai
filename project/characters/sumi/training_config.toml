# 8 GB-safe SDXL LoRA settings (RTX 4060 Laptop, 16 GB RAM) - generated by lora_pipeline.py
pretrained_model_name_or_path = "C:/AnimeAI/comfyui/ComfyUI/models/checkpoints/NoobAI-XL-v1.1.safetensors"
train_data_dir = "C:/AnimeAI/project/characters/sumi/dataset"
output_dir = "C:/AnimeAI/project/characters/sumi/lora"
output_name = "sumi_v1"
logging_dir = "C:/AnimeAI/project/characters/sumi/logs"
caption_extension = ".txt"
# no shuffle_caption: sd-scripts forbids it together with cache_text_encoder_outputs (the bigger VRAM win)

resolution = "1024,1024"
enable_bucket = true
min_bucket_reso = 640
max_bucket_reso = 1536
bucket_reso_steps = 64
bucket_no_upscale = true

network_module = "networks.lora"
network_dim = 16
network_alpha = 8
network_train_unet_only = true        # SDXL text encoders are not trained -> big VRAM saving

optimizer_type = "AdamW8bit"
learning_rate = 1e-4
unet_lr = 1e-4
lr_scheduler = "cosine"
lr_warmup_steps = 50
min_snr_gamma = 5

train_batch_size = 1
max_train_epochs = 10
save_every_n_epochs = 2
save_model_as = "safetensors"
save_precision = "fp16"
mixed_precision = "bf16"
fp8_base = true                       # base UNet in fp8: ~2.5 GB instead of 5 GB
gradient_checkpointing = true
sdpa = true
cache_latents = true
cache_latents_to_disk = true
cache_text_encoder_outputs = true
cache_text_encoder_outputs_to_disk = true
max_data_loader_n_workers = 1
persistent_data_loader_workers = true
seed = 42
